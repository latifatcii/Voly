name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # The app target uses Swift 6.2 build settings: take the newest Xcode on the image.
          NEWEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version

      - name: Unit tests (VolyCore)
        working-directory: Packages/VolyCore
        run: |
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log" | grep -E "error|failed|Executed|Build complete" || true
          grep -q "with 0 failures" "$RUNNER_TEMP/swift-test.log"
          ! grep -q "error:" "$RUNNER_TEMP/swift-test.log"

      - name: Build Voly.app
        run: |
          set -o pipefail
          xcodebuild -project Voly.xcodeproj -scheme Voly -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|^\*\* BUILD|^Embedded" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"

      - name: The app carries the Android agent
        run: |
          RESOURCES="$RUNNER_TEMP/derived/Build/Products/Debug/Voly.app/Contents/Resources"
          ls -l "$RESOURCES"
          found=$(find "$RESOURCES" -name 'voly-agent.dex' | head -1)
          test -n "$found" || { echo "voly-agent.dex is not in the app bundle"; exit 1; }
          dir=$(dirname "$found")
          for f in voly-agent.version voly-agent-arm64-v8a.elf voly-agent-x86_64.elf; do
            test -f "$dir/$f" || { echo "$f is not in the app bundle"; exit 1; }
          done

      - name: Build logs
        if: failure()
        run: |
          grep -B2 -A12 "error:" "$RUNNER_TEMP/swift-test.log" | head -300 || true
          grep -B2 -A12 "error:" "$RUNNER_TEMP/xcodebuild.log" | head -400 || true

  android-agent:
    name: Build the Android agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: AndroidAgent/build.sh "$RUNNER_TEMP/agent"
      - name: Built files
        run: ls -l "$RUNNER_TEMP/agent"
      - name: The agent in the repository is what its version file says
        run: scripts/check-android-agent.sh
      # What ships is Voly/AndroidAgentPayload, not this build. Say so when
      # the two differ: the agent was changed without build.sh being run, or
      # this image's SDK compiles it differently.
      - name: The agent in the repository matches this build
        run: |
          if diff -r "$RUNNER_TEMP/agent" Voly/AndroidAgentPayload; then
            echo "identical"
          else
            echo "::warning::Voly/AndroidAgentPayload differs from a fresh build of AndroidAgent/src"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-agent
          path: ${{ runner.temp }}/agent

  # The agent reads Compose content by reflection, and Compose has renamed
  # what it reads before. One release from each end of the supported range,
  # and two between.
  android-agent-compose:
    name: Android agent reads Compose ${{ matrix.compose }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compose: ["1.5.4", "1.7.8", "1.9.5", "1.12.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/android-agent-test.sh ${{ matrix.compose }}
      - name: Report
        if: failure()
        run: |
          find AndroidAgent/tests/build/test-results -name '*.xml' -exec grep -h -A12 '<failure' {} + | head -200 || true
